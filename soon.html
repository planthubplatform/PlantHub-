<!DOCTYPE html>
<!--
  soon.html — the placeholder behind every front-page door that isn't built yet.

  One page serves them all: the part after # in the address (soon.html#news)
  picks which description shows. To add one, add an entry to SECTIONS below.
  When a section is built for real, point its door in index.html at the new
  page and delete its entry here.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming soon — PlantHub</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="min-h-screen flex flex-col bg-cream text-ink-900 dark:bg-ink-950 dark:text-stone-100 font-sans antialiased">

  <header class="page py-4">
    <a href="index.html" class="font-display font-semibold text-xl tracking-tight inline-flex items-center gap-2 hover:text-clay-700 dark:hover:text-clay-300">
      PlantHub<span class="w-2 h-2 rounded-full bg-signal-500" aria-hidden="true"></span>
    </a>
  </header>

  <main class="page flex-1 flex flex-col items-center justify-center text-center pb-24">
    <p class="text-xs font-semibold uppercase tracking-widest text-clay-600 dark:text-clay-300">Coming soon</p>
    <h1 id="name" class="mt-3 font-display font-semibold text-4xl sm:text-5xl tracking-tight">This page</h1>
    <p id="about" class="mt-4 max-w-md text-ink-400 dark:text-stone-400">It isn't built yet.</p>
    <a href="index.html" class="mt-8 text-sm font-medium px-5 py-2.5 rounded-full bg-ink-900 text-cream dark:bg-cream dark:text-ink-900 hover:bg-ink-700 dark:hover:bg-sand transition">
      Back to the front page
    </a>
  </main>

  <script>
    const SECTIONS = {
      "sign-in":      ["Sign in", "Accounts for nurseries and buyers. Searching the directory will never need one."],
      transport:      ["Plant Transport", "Find someone to move plants from the nursery to the job site."],
      encyclopedia:   ["Plant Encyclopedia", "Learn about different species, written for beginners first."],
      news:           ["Plant News", "What's happening in South Florida plants and nurseries."],
      doc:            ["Plant Doc", "Growing something and it looks wrong? Describe it and get help working out why."],
    };

    function show() {
      const entry = SECTIONS[location.hash.slice(1)];
      if (!entry) return;
      document.getElementById("name").textContent = entry[0];
      document.getElementById("about").textContent = entry[1];
      document.title = entry[0] + " — PlantHub";
    }
    window.addEventListener("hashchange", show);
    show();
  </script>
</body>
</html>
