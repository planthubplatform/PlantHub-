<!--
  favicon.svg — the little icon in the browser tab.

  It's a nursery container with a sprout: the trade's own unit of measure
  (#7, #25, #45). Drawn as SVG so it stays sharp at any size.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="PlantHub">
  <rect width="32" height="32" rx="7" fill="#10211a"/>
  <!-- sprout -->
  <path d="M16 11V8.4" stroke="#4ade80" stroke-width="2" stroke-linecap="round"/>
  <path d="M16 9.2c0-1.8 1.6-3 3.4-2.6-.3 1.9-1.7 2.9-3.4 2.6z" fill="#4ade80"/>
  <path d="M16 10.4c0-1.6-1.4-2.6-3-2.3.3 1.7 1.5 2.5 3 2.3z" fill="#4ade80"/>
  <!-- container rim and body -->
  <rect x="5.5" y="11.6" width="21" height="4.1" rx="1.3" fill="#faf6ef"/>
  <path d="M7.6 17.1h16.8l-1.9 8.2a1.5 1.5 0 0 1-1.5 1.1h-10a1.5 1.5 0 0 1-1.5-1.1z" fill="#faf6ef"/>
</svg>
