<!DOCTYPE html>
<!--
  index.html — the front page.

  Deliberately empty: a sign-in link, the wordmark, one search box, and five
  round doors into the rest of the site. The search box hands whatever is
  typed to the plant directory (directory.html), which does the real work.

  Each round door is an <a> with an icon drawn in SVG. To add, remove or
  reorder a door, copy or move one <li> in the "Doors" list below.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlantHub</title>
  <meta name="description" content="Find plants, the nurseries that grow them, how to move them, and how to keep them alive. South Florida.">

  <link rel="icon" href="favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="min-h-screen flex flex-col bg-cream text-ink-900 dark:bg-ink-950 dark:text-stone-100 font-sans antialiased">

  <!-- ===== Top bar: just the account corner, on the right ============= -->
  <header class="page flex justify-end py-4">
    <!-- store.js fills this in: "Sign in", or your name and "Sign out". -->
    <div data-account-corner class="account-corner"></div>
  </header>

  <!-- ===== The middle of the page ===================================== -->
  <main class="page flex-1 flex flex-col items-center justify-center pb-16">

    <!-- The wordmark, big. The green dot is the same one that marks a fresh
         listing in the directory — green still means fresh, nothing else. -->
    <h1 class="font-display font-semibold tracking-tight text-5xl sm:text-7xl flex items-center gap-3">
      PlantHub<span class="shrink-0 w-3 h-3 sm:w-4 sm:h-4 rounded-full bg-signal-500" aria-hidden="true"></span>
    </h1>
    <p class="mt-3 text-ink-400 dark:text-stone-400 text-center">
      Find it, move it, grow it. South Florida.
    </p>

    <!-- The search box. A plain form: pressing Enter opens
         directory.html?q=whatever-was-typed, and the directory picks it up. -->
    <form action="directory.html" method="get" role="search" class="mt-8 w-full max-w-2xl">
      <label class="sr-only" for="q">Search for a plant</label>
      <div class="relative">
        <svg class="absolute left-5 top-1/2 -translate-y-1/2 w-5 h-5 text-ink-400 pointer-events-none"
             viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path>
        </svg>
        <input id="q" name="q" type="search" autocomplete="off"
               placeholder="Search a plant, nursery or city"
               class="w-full rounded-full pl-14 pr-28 py-4 text-base
                      bg-white dark:bg-ink-900 border border-ink-100 dark:border-ink-700
                      shadow-sm placeholder:text-ink-400 dark:placeholder:text-stone-500
                      focus:outline-none focus:ring-2 focus:ring-clay-500 focus:border-transparent transition">
        <button type="submit"
                class="absolute right-2 top-1/2 -translate-y-1/2 px-5 py-2.5 rounded-full text-sm font-semibold
                       bg-ink-900 text-cream dark:bg-cream dark:text-ink-900
                       hover:bg-ink-700 dark:hover:bg-sand focus:outline-none focus-visible:ring-2 focus-visible:ring-clay-500 transition">
          Search
        </button>
      </div>
    </form>

    <!-- ===== Doors: one round icon per part of the site =================
         Only the directory exists today; the others open soon.html, which
         says what each one will be. -->
    <nav aria-label="Sections" class="mt-12 w-full max-w-3xl">
      <ul class="flex flex-wrap justify-center gap-x-6 gap-y-8 sm:gap-x-2">

        <li>
          <a href="directory.html" class="door">
            <span class="door-circle">
              <!-- A storefront: nurseries and what they have. -->
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v10h16V10"/><path d="M3 10l2-6h14l2 6"/><path d="M3 10a3 3 0 0 0 6 0a3 3 0 0 0 6 0a3 3 0 0 0 6 0"/><path d="M10 20v-5h4v5"/></svg>
            </span>
            <span class="door-label">Plant Directory</span>
          </a>
        </li>

        <li>
          <a href="soon.html#transport" class="door">
            <span class="door-circle">
              <!-- A truck. -->
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 6h11v10H2z"/><path d="M13 9h4l4 4v3h-8"/><circle cx="6" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></svg>
            </span>
            <span class="door-label">Plant Transport</span>
          </a>
        </li>

        <li>
          <a href="soon.html#encyclopedia" class="door">
            <span class="door-circle">
              <!-- An open book. -->
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6c-2-1.5-5-2-8-1.5V19c3-.5 6 0 8 1.5"/><path d="M12 6c2-1.5 5-2 8-1.5V19c-3-.5-6 0-8 1.5"/><path d="M12 6v14.5"/></svg>
            </span>
            <span class="door-label">Plant Encyclopedia</span>
          </a>
        </li>

        <li>
          <a href="soon.html#news" class="door">
            <span class="door-circle">
              <!-- A newspaper. -->
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h13v14H6a2 2 0 0 1-2-2z"/><path d="M17 9h3v8a2 2 0 0 1-2 2"/><path d="M7 9h7M7 12h7M7 15h4"/></svg>
            </span>
            <span class="door-label">Plant News</span>
          </a>
        </li>

        <li>
          <a href="soon.html#doc" class="door">
            <span class="door-circle">
              <!-- A leaf with a medical cross: something's wrong, help. -->
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19C5 10 10 5 20 4c-1 10-6 15-15 15z"/><path d="M5 19l6-6"/><path d="M14 8v4M12 10h4"/></svg>
            </span>
            <span class="door-label">Plant Doc</span>
          </a>
        </li>

      </ul>
    </nav>
  </main>

  <script src="store.js"></script>
  <script>
    // On a computer, put the cursor straight in the search box. Not on a
    // phone: there it would pop the keyboard up over the page.
    if (window.matchMedia("(min-width: 1024px)").matches) {
      document.getElementById("q").focus();
    }
  </script>

  <footer class="page py-6 text-center text-[13px] text-ink-400 dark:text-stone-500">
    Early prototype. Directory listings are sample data and do not describe real businesses.
  </footer>
</body>
</html>
