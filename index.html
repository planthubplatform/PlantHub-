<!DOCTYPE html>
<!--
  index.html — the page itself.
  HTML describes WHAT is on the page (headings, boxes, text).
  The look comes from styles.css, and the search behaviour comes from app.js.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Tells phones to use their real width instead of pretending to be a desktop. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlantHub — Wholesale Plant & Nursery Search</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="site-header">
    <div class="wrap">
      <h1 class="logo">Plant<span>Hub</span></h1>
      <p class="tagline">Wholesale plant &amp; nursery search — South Florida</p>
    </div>
  </header>

  <main class="wrap">

    <!-- The search box. "id" gives app.js a way to find this element. -->
    <section class="search-panel">
      <label class="search-label" for="search">Search for a plant</label>
      <div class="search-row">
        <input
          type="search"
          id="search"
          placeholder="Try: clusia, live oak, or Wodyetia"
          autocomplete="off">
        <button type="button" id="clear" class="clear-btn">Clear</button>
      </div>
      <p class="hint">Search by common name, botanical name, nursery, or city.</p>

      <!-- Quick example searches, so a first-time visitor isn't staring at a blank box. -->
      <div class="chips" id="chips">
        <button type="button" class="chip">palm</button>
        <button type="button" class="chip">clusia</button>
        <button type="button" class="chip">live oak</button>
        <button type="button" class="chip">mango</button>
        <button type="button" class="chip">Loxahatchee</button>
      </div>
    </section>

    <p class="count" id="count"></p>

    <!-- app.js fills this with nursery cards. It starts empty on purpose. -->
    <div id="results" class="results"></div>

  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p><strong>Sample data.</strong> The nurseries, availability and contact details on this
      page are invented for testing and do not describe real businesses.</p>
    </div>
  </footer>

  <!-- Order matters: the data must load before the code that uses it. -->
  <script src="data/nurseries.js"></script>
  <script src="app.js"></script>
</body>
</html>
